<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aprovação de Comissão · Hub GPSBI</title>
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html{zoom:1;} /* essa página é pública/mobile — sem o zoom .8 do resto do Hub */
body{padding-bottom:24px;}
.ap-wrap{max-width:560px;margin:0 auto;padding:20px 16px;}
.ap-header{text-align:center;margin-bottom:18px;}
.ap-header .logo{font-size:13px;font-weight:800;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.ap-header h1{font-size:19px;font-weight:800;}
.ap-header .sub{font-size:12.5px;color:var(--text3);margin-top:4px;}
.ap-card{background:var(--navy2);border:1px solid var(--border2);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.ap-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
.ap-row:last-child{border-bottom:none;}
.ap-row .nome{font-size:13.5px;font-weight:700;flex:1;min-width:0;}
.ap-row .valores{text-align:right;font-size:12px;color:var(--text2);}
.ap-row .valores b{font-family:'DM Mono',monospace;font-size:13.5px;color:var(--text);display:block;}
.ap-total{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:6px;border-top:2px solid var(--border2);}
.ap-total .lbl{font-size:13px;font-weight:800;}
.ap-total .val{font-family:'DM Mono',monospace;font-size:20px;font-weight:800;color:var(--cyan);}
.ap-detail-lbl{font-size:9.5px;text-transform:uppercase;color:var(--text3);letter-spacing:.04em;}
.ap-approve-box{text-align:center;padding:8px 4px 4px;}
.ap-approve-box input[type="text"]{margin-bottom:12px;text-align:center;}
.ap-btn-approve{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff;font-family:'Sora',sans-serif;font-size:15px;font-weight:800;cursor:pointer;}
.ap-btn-approve:active{opacity:.85;}
.ap-btn-approve:disabled{opacity:.5;}
.ap-approved-box{text-align:center;padding:20px 10px;}
.ap-approved-box .icon{font-size:40px;margin-bottom:8px;}
.ap-approved-box .msg{font-size:14px;font-weight:700;color:var(--green);}
.ap-approved-box .when{font-size:12px;color:var(--text3);margin-top:6px;}
.ap-error{text-align:center;padding:30px 16px;color:var(--text3);}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>

<div id="mainContent" style="display:none;">
  <div class="ap-wrap">
    <div class="ap-header">
      <div class="logo">Hub GPSBI · Tangram</div>
      <h1 id="apTitulo">Resumo de Comissão</h1>
      <div class="sub" id="apMesAno"></div>
    </div>

    <div class="ap-card">
      <div id="apLinhas"></div>
      <div class="ap-total">
        <span class="lbl">Total Geral</span>
        <span class="val" id="apTotalGeral">—</span>
      </div>
    </div>

    <div class="ap-card" id="apAcaoCard"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://mczggrocmccvmyglnumv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jemdncm9jbWNjdm15Z2xudW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjM2NzcsImV4cCI6MjA5ODU5OTY3N30.XXzhDvxfNaUW61HvgE4xuqzSICoLEYjbJhd1X52Zp84';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
document.documentElement.style.visibility='visible'; // página pública, sem tela de login pra esperar

function el(id){return document.getElementById(id)}
function escapeHtml(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mesAnoLabel(mesAno){
  const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const[ano,mes]=(mesAno||'').split('-');
  return mes&&ano?`${MESES[Number(mes)-1]} de ${ano}`:mesAno||'';
}

let registro=null;

async function init(){
  const params=new URLSearchParams(location.search);
  const token=params.get('token');
  if(!token){ mostrarErro('Link inválido — faltou o código de acesso.'); return; }

  const{data,error}=await sb.from('tangram_comissao_aprovacoes').select('*').eq('token',token).limit(1);
  if(error||!data||!data.length){ mostrarErro('Não encontrei esse link. Pode ter expirado ou o endereço veio incompleto — pede pro Gustavo gerar de novo.'); return; }

  registro=data[0];
  render();
  el('loadingScreen').style.display='none';
  el('mainContent').style.display='block';
}

function mostrarErro(msg){
  el('loadingScreen').style.display='none';
  document.body.innerHTML=`<div class="ap-wrap"><div class="ap-card ap-error"><div style="font-size:34px;margin-bottom:8px;">⚠️</div>${escapeHtml(msg)}</div></div>`;
  document.documentElement.style.visibility='visible';
}

function render(){
  const dados=registro.dados||{linhas:[],totalGeral:'—'};
  el('apMesAno').textContent=mesAnoLabel(registro.mes_ano);
  el('apLinhas').innerHTML=(dados.linhas||[]).map(l=>`
    <div class="ap-row">
      <div class="nome">${escapeHtml(l.vendedor)}</div>
      <div class="valores">
        <div class="ap-detail-lbl">Comissão + Premiação + Serviços</div>
        <b>${escapeHtml(l.comissao)} · ${escapeHtml(l.premiacao)} · ${escapeHtml(l.servicos)}</b>
      </div>
    </div>`).join('') || '<div style="text-align:center;color:var(--text3);padding:20px;">Nenhum vendedor neste período.</div>';
  el('apTotalGeral').textContent=dados.totalGeral||'—';

  const acaoCard=el('apAcaoCard');
  if(registro.status==='aprovado'){
    acaoCard.innerHTML=`
      <div class="ap-approved-box">
        <div class="icon">✅</div>
        <div class="msg">Aprovado${registro.aprovado_por_nome?' por '+escapeHtml(registro.aprovado_por_nome):''}</div>
        <div class="when">${new Date(registro.aprovado_em).toLocaleString('pt-BR')}</div>
      </div>`;
  } else {
    acaoCard.innerHTML=`
      <div class="ap-approve-box">
        <input type="text" id="apNome" placeholder="Seu nome (opcional)">
        <button class="ap-btn-approve" id="apBtnAprovar" onclick="aprovar()">✅ Confirmar aprovação</button>
      </div>`;
  }
}

async function aprovar(){
  const btn=el('apBtnAprovar');
  btn.disabled=true; btn.textContent='Enviando...';
  const nome=(el('apNome')&&el('apNome').value.trim())||null;
  const{error}=await sb.from('tangram_comissao_aprovacoes').update({
    status:'aprovado', aprovado_em:new Date().toISOString(), aprovado_por_nome:nome
  }).eq('token',registro.token);
  if(error){ alert('Não consegui registrar a aprovação: '+error.message); btn.disabled=false; btn.textContent='✅ Confirmar aprovação'; return; }
  registro.status='aprovado'; registro.aprovado_em=new Date().toISOString(); registro.aprovado_por_nome=nome;
  render();
}

init();
</script>
</body>
</html>
